# Docs — builds the versioned site onto the gh-pages branch.
#
#   push to dev   -> gh-pages/dev/        (the development docs)
#   tag vX.Y.Z    -> gh-pages/X.Y.Z/  + switcher.json + stable/ -> X.Y.Z
#
# A released version's folder is never rebuilt, so every version's docs keep describing exactly
# what its users installed.
name: docs

on:
  push:
    branches: [dev]                 # the development docs, on every push
  workflow_dispatch:
    # Rebuild ONE already-released version's docs, to improve its documentation after the fact.
    # The checkout is that version's own TAG, so the API reference still describes the code that
    # version contains; only the prose changes, and only by first committing it to the tag's
    # docs/ via a fix branch. Nothing here can make a released folder describe newer code.
    inputs:
      version:
        description: "Released version to rebuild, without the leading v (e.g. 1.4.0)"
        required: true
  workflow_run:
    # A version folder is published only when the RELEASE succeeds, never on the tag alone.
    # Building on the tag meant a release that failed after tagging still left its version on
    # the site, offering docs for something nobody can install.
    workflows: [release]
    types: [completed]

permissions:
  contents: write        # the only thing that writes gh-pages

concurrency:
  group: docs            # two docs deploys must never interleave on one branch
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # a failed release publishes nothing
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch'
                   && format('refs/tags/v{0}', inputs.version)
                   || (github.event_name == 'workflow_run'
                       && github.event.workflow_run.head_sha || github.ref) }}
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Work out the destination folder
        id: dest
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # a rebuild of an existing released folder; it must not move `stable`
            echo "folder=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # the release that just succeeded; its head_branch is the tag
            VERSION="${{ github.event.workflow_run.head_branch }}"
            echo "folder=${VERSION#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "folder=dev" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - run: uv run sphinx-build -W --keep-going docs docs/_build/html
      - name: Publish into gh-pages
        env:
          SWITCHER: |
            import json, pathlib, sys
            version = sys.argv[1]
            path = pathlib.Path("gh-pages/switcher.json")
            entries = json.loads(path.read_text()) if path.exists() else []
            entries = [e for e in entries if e.get("version") != version]
            entries.insert(0, {"name": version, "version": version, "url": f"../{version}/"})
            path.write_text(json.dumps(entries, indent=2))
        run: |
          set -euo pipefail
          FOLDER="${{ steps.dest.outputs.folder }}"
          git fetch origin gh-pages && git worktree add gh-pages origin/gh-pages
          rm -rf "gh-pages/${FOLDER}"
          cp -r docs/_build/html "gh-pages/${FOLDER}"
          if [[ "${{ steps.dest.outputs.release }}" == "true" ]]; then
            rm -rf gh-pages/stable && cp -r docs/_build/html gh-pages/stable
            # switcher.json feeds the pydata theme's version dropdown. The script is passed in
            # as an env var rather than a heredoc: an unindented heredoc body would terminate
            # this YAML block scalar and silently truncate the step.
            python -c "$SWITCHER" "$FOLDER"
          fi
          cd gh-pages
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -m "docs: ${FOLDER}" || exit 0
          git push origin HEAD:gh-pages
